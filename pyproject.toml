[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthbench"
version = "0.2.0"
description = "Earth Decision Intelligence Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY 4.0"}
authors = [
    {name = "Kejia Shao"},
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    # cars_serve/cars_serve_impact/cars_verify*/tests 均为顶层 import，属核心依赖
    "numpy>=1.24",
    # 注：httpx 已移除——全仓库无引用，HTTP 走 urllib.request
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
llm = [
    "openai>=1.0",
]
vision = [
    "torch>=2.0",
    "rasterio>=1.3",
]
cars = [
    # deep-NGR serving; `pip install -e ../CRPS` provides crps-cars (local, not on PyPI)
    "scipy",
    "xarray",
    "cfgrib",
    "crps-cars",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# 渐进式规则集：pyflakes/pycodestyle 错误 + import 排序 + bugbear + pyupgrade。
# 刻意不启用 E501（存量长行多，先不制造大 diff）、BLE（优雅降级路径大量
# except Exception 是设计选择，见 verification/data_collectors 的降级语义）。
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "B905",   # zip() strict 参数：3.10 兼容噪音
    "UP015",  # open(..., "r") 显式模式无害
]

[project.scripts]
earthbench-eval = "earthbench.__main__:main"

[tool.setuptools.packages.find]
include = ["earthbench*"]
