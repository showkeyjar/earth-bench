[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthbench"
version = "0.1.0"
description = "Earth Decision Intelligence Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY 4.0"}
authors = [
    {name = "Kejia Shao"},
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "openai>=1.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
llm = [
    "openai>=1.0",
]
vision = [
    "torch>=2.0",
    "rasterio>=1.3",
]

[project.scripts]
earthbench-eval = "earthbench.__main__:main"

[tool.setuptools.packages.find]
include = ["earthbench*"]
