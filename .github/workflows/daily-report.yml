name: Daily Earth Risk Report

on:
  schedule:
    # 北京时间每天 08:00 (UTC 00:00)
    - cron: '0 0 * * *'
    # 北京时间每天 20:00 (UTC 12:00)
    - cron: '0 12 * * *'
  push:
    paths:
      - 'earthbench/**'
      - 'pyproject.toml'
      - '.github/workflows/daily-report.yml'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Fetch prior data from gh-pages (decisions + verification + accuracy + thresholds)
        continue-on-error: true
        run: |
          mkdir -p published_reports
          # Fetch historical decision files (for history tracking)
          for f in $(curl -s "https://api.github.com/repos/showkeyjar/earth-bench/contents/?ref=gh-pages" | python3 -c "import sys,json; [print(x['name']) for x in json.load(sys.stdin) if x['name'].startswith('decisions_') and x['name'].endswith('.json')]" 2>/dev/null); do
            curl -s "https://raw.githubusercontent.com/showkeyjar/earth-bench/gh-pages/$f" -o "published_reports/$f" || true
          done
          # Fetch prior verification files (so accuracy_trend can accumulate)
          for f in $(curl -s "https://api.github.com/repos/showkeyjar/earth-bench/contents/?ref=gh-pages" | python3 -c "import sys,json; [print(x['name']) for x in json.load(sys.stdin) if x['name'].startswith('verification_') and x['name'].endswith('.json')]" 2>/dev/null); do
            curl -s "https://raw.githubusercontent.com/showkeyjar/earth-bench/gh-pages/$f" -o "published_reports/$f" || true
          done
          # Fetch prior calibration data (thresholds + log + status)
          for f in thresholds.json calibration_log.json calibration_status.json accuracy_trend.json; do
            curl -s "https://raw.githubusercontent.com/showkeyjar/earth-bench/gh-pages/$f" -o "published_reports/$f" || true
          done
          echo "Prior data ready:"
          ls -1 published_reports/decisions_*.json 2>/dev/null || echo "(no decisions)"
          ls -1 published_reports/verification_*.json 2>/dev/null || echo "(no verifications)"
          ls -1 published_reports/thresholds.json 2>/dev/null || echo "(no thresholds)"
          ls -1 published_reports/calibration_log.json 2>/dev/null || echo "(no calibration log)"

      - name: Generate daily report
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          # Remove today's verification file so it gets regenerated with latest fixes
          TODAY=$(date -u -d "+8 hours" +%Y%m%d)
          TARGET=$(date -u -d "+8 hours -2 days" +%Y%m%d)
          rm -f "published_reports/verification_${TARGET}.json" 2>/dev/null || true
          echo "Removed verification_${TARGET}.json for re-generation"
          python -m earthbench.publish_pipeline --run

      - name: Sync UI assets into publish bundle
        # published_reports 是 gh-pages/Cloudflare 的发布目录；
        # 每次发布前把 main 根最新的 index.html 与域名/SEO 文件同步进去，
        # 避免线上 UI 一直停留在旧版本（之前 published_reports/index.html 是 7/26 旧版）。
        run: |
          cp index.html published_reports/index.html
          cp CNAME published_reports/CNAME || true
          cp robots.txt published_reports/robots.txt || true
          cp sitemap.xml published_reports/sitemap.xml || true
          echo "Synced UI assets:"
          ls -l published_reports/index.html published_reports/CNAME

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./published_reports
          force_orphan: true
          commit_message: "📊 Daily report: ${{ github.event.head_commit.timestamp }}"

      - name: Deploy to Cloudflare Pages
        # 恢复原有自动部署：与 GitHub Pages 同一份 published_reports 一起推到 earth-ai.fun
        # 注意：GitHub Actions 不允许在步骤 if 中使用 secrets 上下文，
        # 因此这里始终运行，由下方 bash 检查 CLOUDFLARE_ACCOUNT_ID 是否存在；
        # 缺失则给出清晰警告并正常退出（不部署），不会让 job 失败。
        # continue-on-error：即使 Cloudflare 部署失败，也绝不阻断上面的 GitHub Pages 部署。
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID 未配置；将尝试直接用 CLOUDFLARE_API_TOKEN 部署（若 token 为单账户作用域则可能成功）。"
            echo "::warning::若失败，请在 Cloudflare 控制台首页复制 Account ID，到仓库 Settings → Secrets and variables → Actions 添加名为 CLOUDFLARE_ACCOUNT_ID 的密钥后重跑。"
          fi
          npm install -g wrangler
          wrangler pages deploy published_reports --project-name earth-bench --commit-dirty=true
