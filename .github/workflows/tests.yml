name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'earthbench/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'earthbench/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'

# 同一分支/PR 的新推送取消旧运行，省配额
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ruff
        run: |
          pip install ruff
          ruff check earthbench scripts tests

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.10：矩阵实际验证下边界与当前稳定版
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # numpy 已是核心依赖（cars_serve 等顶层 import），dev extra 提供 pytest/pytest-cov
          pip install -e .[dev]

      - name: Run tests
        env:
          # 显式清空外部服务凭据，确保测试不依赖网络/key
          #（tests/conftest.py 内部亦有 autouse 保障，双保险）
          QWEATHER_API_KEY: ''
          FIRMS_MAP_KEY: ''
        run: python -m pytest tests/ -v --tb=short --cov=earthbench --cov-report=term

      - name: Historical backfill validation (GT vs documented reality)
        run: python scripts/validate_historical.py
